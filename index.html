const fromB64=(s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let busy=false;
async function unlock(passphrase){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(passphrase),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(data.salt),iterations:data.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(data.iv),additionalData:enc.encode('OKAZAKI-QUEST-v1')},key,fromB64(data.ciphertext));
  const stream=new Blob([clear]).stream().pipeThrough(new DecompressionStream('gzip'));
  const page=await new Response(stream).text();
  const frame=document.createElement('iframe');
  frame.className='viewer';frame.title='岡崎まち感光 旅のしおり';
  frame.addEventListener('load',()=>{document.getElementById('gate').classList.add('hidden');document.getElementById('top').classList.add('hidden');document.title='OKAZAKI / まち感光 QUEST';});
  frame.srcdoc=page;
  document.body.appendChild(frame);
}
document.getElementById('unlock-form').addEventListener('submit',async e=>{
  e.preventDefault();if(busy)return;busy=true;
  const button=document.getElementById('unlock-btn'),message=document.getElementById('msg');
  const value=document.getElementById('code').value.trim().toUpperCase().replace(/[‐‑‒–—−]/g,'-');
  button.disabled=true;button.textContent='DECRYPTING…';message.textContent='ロックを解除しています…';
  try{
    if(!window.isSecureContext || !crypto?.subtle || typeof DecompressionStream==='undefined')throw new Error('unsupported');
    await unlock(value);document.getElementById('code').value='';message.textContent='';
  }catch(err){message.textContent=err.message==='unsupported'?'HTTPS対応の最新ブラウザで開いてください。':'アクセスキーが違うか、データを開けませんでした。';document.getElementById('code').select();}
  finally{button.disabled=false;button.textContent='ENTER QUEST →';busy=false;}
});
